<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🌐 GOOGLE SEO OPTIMIZATION (تجهيز الأرشفة للظهور في نتائج بحث جوجل) -->
    <title>Advanced Triangle Counter - Combinatorics Engine by Eng. Md. Abu Hantash</title>
    <meta name="description" content="Discover an innovative geometric combinatorics algorithm developed by Eng. Md. Abu Hantash to calculate the total number of triangles formed inside a main triangle. Fast, secure, and accurate.">
    <meta name="keywords" content="triangle counter, Eng. Md. Abu Hantash, Abu Hantash triangle formula, count triangles in a triangle formula, geometric combinatorics algorithm, triangle intersection counter, non-symmetric triangle formula">
    <meta name="author" content="Eng. Md. Abu Hantash">
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --accent: #0f172a;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-wrapper {
            display: flex;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1000px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .calculator-side {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
        }
        .diagram-side {
            flex: 1;
            background-color: #fafafa;
            border-left: 1px solid var(--border);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 6px 0;
            color: var(--accent);
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .error-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            color: #b91c1c;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .result-box h2 {
            margin: 0 0 5px 0;
            color: #166534;
            font-size: 16px;
        }
        .result-value {
            font-size: 36px;
            font-weight: 800;
            color: #15803d;
        }
        .guide-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
            align-self: flex-start;
        }
        .guide-list {
            padding: 0;
            margin: 20px 0 0 0;
            list-style: none;
            width: 100%;
        }
        .guide-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.5;
            color: #475569;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            margin-right: 8px;
            color: white;
            flex-shrink: 0;
        }

        /* 👤 AUTHOR & CONTACT DESIGN (بطاقة التعريف والتواصل الرسمية بالمهندس) */
        .author-card {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-top: 20px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .author-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: var(--accent);
        }
        .author-info p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }
        .contact-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-contact {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .btn-contact:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .copyright-text {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 850px) {
            .main-wrapper, .author-card {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .diagram-side {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- LEFT SIDE: THE CALCULATOR -->
    <div class="calculator-side">
        <h1>📐 Advanced Triangle Counter</h1>
        <div class="subtitle">Next-Generation Geometric Calculation System</div>
        
        <div class="input-group">
            <label>Lines from Vertex 1</label>
            <input type="number" id="v1" placeholder="0">
        </div>
        
        <div class="input-group">
            <label>Lines from Vertex 2</label>
            <input type="number" id="v2" placeholder="0">
        </div>
        
        <div class="input-group">
            <label>Lines from Vertex 3</label>
            <input type="number" id="v3" placeholder="0">
        </div>
        
        <div class="input-group">
            <label>Triple Intersection Points (P)</label>
            <input type="number" id="p_val" placeholder="0">
        </div>
        
        <button onclick="calculateTriangles()">Calculate Total Triangles</button>
        
        <!-- Error Display Box -->
        <div class="error-box" id="errorBox"></div>
        
        <div class="result-box" id="resultBox">
            <h2>Total Triangles Formed:</h2>
            <div class="result-value" id="resultValue">0</div>
        </div>
    </div>

    <!-- RIGHT SIDE: VISUAL DIAGRAM & GUIDE -->
    <div class="diagram-side">
        <div class="guide-title">📊 Geometric Input Guide</div>
        
        <svg width="280" height="240" viewBox="0 0 280 240" style="background: #fff; border-radius: 12px; border: 1px solid var(--border); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
            <polygon points="140,20 30,200 250,200" fill="none" stroke="#0f172a" stroke-width="3"/>
            <line x1="140" y1="20" x2="140" y2="200" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4"/>
            <line x1="30" y1="200" x2="175" y2="78" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4"/>

            <text x="5" y="215" font-weight="bold" font-size="12" fill="#16a34a">Vertex 2</text>
            <text x="235" y="215" font-weight="bold" font-size="12" fill="#ea580c">Vertex 3</text>
            <circle cx="140" cy="110" r="5" fill="#ef4444"/>
            <text x="150" y="114" font-weight="bold" font-size="11" fill="#ef4444">Point P</text>
        </svg>
        
        <ul class="guide-list">
            <li class="guide-item">
