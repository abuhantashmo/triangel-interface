function autoDetectLanguage() {
const userLang = navigator.language || navigator.userLanguage;
if (userLang && userLang.startsWith('ar')) {
document.getElementById('langSelect').value = 'ar';
changeLanguage('ar');
} else {
document.getElementById('langSelect').value = 'en';
changeLanguage('en');
}
}
window.onload = autoDetectLanguage;
async function calculateTriangles() {
let v1 = document.getElementById('v1').value.trim();
let v2 = document.getElementById('v2').value.trim();
let v3 = document.getElementById('v3').value.trim();
let p_val = document.getElementById('p_val').value.trim();
let errorBox = document.getElementById('errorBox');
let errorText = document.getElementById('errorText');
let resultBox = document.getElementById('resultBox');
let calcBtn = document.getElementById('calcBtn');
let timerBox = document.getElementById('timerBox');
const t = translations[currentLang];
errorBox.style.display = 'none';
resultBox.style.display = 'none';
if (countdownInterval) clearInterval(countdownInterval);
if(!v1 || !v2 || !v3 || !p_val) {
errorText.innerText = t.valError;
errorBox.style.display = 'flex';
return;
}
const strictIntegerRegex = /^\d+$/;
if (!strictIntegerRegex.test(v1) || !strictIntegerRegex.test(v2) || !strictIntegerRegex.test(v3) || !strictIntegerRegex.test(p_val)) {
errorText.innerText = t.invError;
errorBox.style.display = 'flex';
return;
}
calcBtn.disabled = true;
timerBox.style.display = 'flex';
document.getElementById('timerText').innerHTML = t.timer;
let timeLeft = 25;
document.getElementById('secondsCount').innerText = timeLeft;
countdownInterval = setInterval(() => {
timeLeft--;
const liveSpan = document.getElementById('secondsCount');
if (liveSpan) {
if (timeLeft >= 0) {
liveSpan.innerText = timeLeft;
} else {
liveSpan.innerText = "0";
}
}
}, 1000);
try {
let response = await fetch('onrender.com', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ v1: v1, v2: v2, v3: v3, p_val: p_val })
});
let data = await response.json();
clearInterval(countdownInterval);
timerBox.style.display = 'none';
calcBtn.disabled = false;
if (data.success) {
document.getElementById('resultValue').innerText = data.result;
resultBox.style.display = 'block';
if(data.total_calls) {
document.getElementById('totalCallsValue').innerText = data.total_calls;
document.getElementById('callCounterBox').style.display = 'block';
}
gtag('event', 'calculate_success', { 'event_category': 'Engagement', 'event_label': 'Triangle Formula Calculation' });
} else {
errorText.innerText = data.error;
errorBox.style.display = 'flex';
}
} catch (error) {
clearInterval(countdownInterval);
timerBox.style.display = 'none';
calcBtn.disabled = false;
errorText.innerText = t.connError;
errorBox.style.display = 'flex';
}
}
